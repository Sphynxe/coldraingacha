<!DOCTYPE html>

<html lang="zh">
<head>
<meta charset="UTF-8">

<!-- ✅ 关键：禁止缩放 -->

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Card Draw</title>

<style>
body {
  margin: 0;
  background: white;
  font-family: sans-serif;

  /* ✅ 防止双击放大 */
  touch-action: manipulation;
}

/* Start */
#startScreen {
  position: fixed;
  width: 100%;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

/* Main */
#main {
  display: none;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

/* 卡片 */
.card-box {
  width: 80vw;
  max-width: 400px;
  aspect-ratio: 3 / 4;
  position: relative;
}

#realCard, #tearCard, #effect {
  width: 100%;
  height: 100%;
  object-fit: contain;
  position: absolute;
}

#tearCard {
  cursor: pointer;
}

/* 特效 */
#effect {
  pointer-events: none;
  opacity: 0;
}

/* 抖动 */
@keyframes shake {
  0% { transform: translate(0,0); }
  25% { transform: translate(-2px,1px); }
  50% { transform: translate(2px,-1px); }
  75% { transform: translate(-1px,2px); }
  100% { transform: translate(0,0); }
}

.shake {
  animation: shake 0.2s;
}

/* 按钮 */
.draw-btn {
  margin-top: 30px;
  padding: 14px 30px;
  font-size: 18px;
  border: none;
  border-radius: 12px;
  background: #eee;
}
</style>

</head>

<body>

<div id="startScreen">
  <h1>Card Pack</h1>
  <button class="draw-btn" onclick="startGame()">START</button>
</div>

<div id="main">
  <div class="card-box">
    <img id="realCard" src="">
    <img id="tearCard" src="" onclick="clickCard()">
    <img id="effect" src="fire1.gif">
  </div>

<button class="draw-btn" onclick="startDraw()">DRAW</button>

</div>

<audio id="bgmSSR" src="sfx1.m4a" loop></audio>

<script>
const pool = {
  R: ["r1.png","r2.png"],
  SR: ["sr1.png"],
  SSR: ["ssr1.png"]
};

let clickCount = 0;
let isOpening = false;
let currentRarity = "";

window.onload = function() {
  document.getElementById("tearCard").src = "tear1.png";
};

function startGame() {
  document.getElementById("startScreen").style.display = "none";
  document.getElementById("main").style.display = "flex";
}

function startDraw() {
  clickCount = 0;
  isOpening = true;

  let music = document.getElementById("bgmSSR");
  music.pause();
  music.currentTime = 0;

  let rand = Math.random();

  if (rand < 0.6) currentRarity = "R";
  else if (rand < 0.9) currentRarity = "SR";
  else currentRarity = "SSR";

  let card = pool[currentRarity][Math.floor(Math.random() * pool[currentRarity].length)];

  document.getElementById("realCard").src = card;

  let tear = document.getElementById("tearCard");
  tear.style.opacity = "1";
  tear.src = "tear1.png";
}

function clickCard() {
  if (!isOpening) return;

  clickCount++;

  let tear = document.getElementById("tearCard");

  tear.classList.add("shake");
  setTimeout(() => tear.classList.remove("shake"), 200);

  if (clickCount === 1) {
    tear.src = "tear2.png";
  } else if (clickCount === 2) {
    tear.src = "tear3.png";
  } else if (clickCount === 3) {
    tear.src = "tear4.png";

    if (currentRarity === "SSR") {
      let effect = document.getElementById("effect");
      effect.style.opacity = "1";

      setTimeout(() => {
        effect.style.opacity = "0";
      }, 800);

      let music = document.getElementById("bgmSSR");
      music.currentTime = 0;
      music.play();
    }

    setTimeout(() => {
      tear.style.opacity = "0";
      isOpening = false;
    }, 300);
  }
}
</script>

</body>
</html>
